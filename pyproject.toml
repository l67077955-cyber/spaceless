[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spaceless"
version = "0.1.0"
description = "Type English without spaces; spaceless puts them back."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["wordninja==2.0.0", "pynput>=1.8"]

[project.scripts]
spaceless = "spaceless.app:main"

[tool.setuptools]
packages = ["spaceless"]
