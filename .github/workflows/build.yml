name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install . pytest pyinstaller
      - name: Test
        run: pytest -q
      - name: Build exe
        shell: pwsh
        run: |
          # wordninja is a single module whose word list sits in a sibling folder
          $words = python -c "import os, wordninja; print(os.path.join(os.path.dirname(wordninja.__file__), 'wordninja', 'wordninja_words.txt.gz'))"
          pyinstaller --onefile --name spaceless `
            --add-data "${words};wordninja" `
            --hidden-import pynput.keyboard._win32 `
            --hidden-import pynput.mouse._win32 `
            spaceless/__main__.py
      - name: Smoke test exe
        run: dist/spaceless.exe --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: spaceless-exe
          path: dist/spaceless.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create ${{ github.ref_name }} dist/spaceless.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
